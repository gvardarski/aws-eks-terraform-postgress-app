apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventory.api.fullname" . }}
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    {{- include "inventory.api.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "inventory.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
