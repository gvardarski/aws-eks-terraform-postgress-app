{{- if not .Values.postgres.auth.existingSecret }}
{{- if not .Values.postgres.auth.password }}
{{- fail "postgres.auth.password is required when postgres.auth.existingSecret is empty" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inventory.postgres.fullname" . }}
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    {{- include "inventory.postgres.selectorLabels" . | nindent 4 }}
type: Opaque
stringData:
  # Consumed by the postgres image on first start.
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
  # Consumed by the API container.
  DB_NAME: {{ .Values.postgres.auth.database | quote }}
  DB_USER: {{ .Values.postgres.auth.username | quote }}
  DB_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
