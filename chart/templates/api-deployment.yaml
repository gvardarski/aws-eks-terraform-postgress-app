apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inventory.api.fullname" . }}
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    {{- include "inventory.api.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "inventory.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Restart the pods whenever the rendered configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "inventory.labels" . | nindent 8 }}
        {{- include "inventory.api.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "inventory.api.fullname" . }}
            - secretRef:
                name: {{ include "inventory.secretName" . }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
