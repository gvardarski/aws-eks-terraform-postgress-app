apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "inventory.postgres.fullname" . }}
  labels:
    {{- include "inventory.labels" . | nindent 4 }}
    {{- include "inventory.postgres.selectorLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "inventory.postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "inventory.postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inventory.labels" . | nindent 8 }}
        {{- include "inventory.postgres.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            # Keep the data one level below the mount point so that the
            # volume's lost+found directory cannot upset initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "inventory.secretName" . }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      {{- if not .Values.postgres.persistence.enabled }}
      volumes:
        - name: postgres-data
          emptyDir: {}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    # apiVersion and kind are set explicitly because the API server populates
    # them on the stored object; omitting them leaves Argo CD permanently OutOfSync.
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
  {{- end }}
